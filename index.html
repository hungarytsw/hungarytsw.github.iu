<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tíz Szó</title>
<style>
/* ---------- tokens ---------- */
:root{
  --bg:#FAF8F4;          /* warm paper */
  --surface:#FFFFFF;
  --surface2:#F1EEE7;
  --ink:#20241F;
  --ink-soft:#6B7066;
  --line:#E3DFD5;
  --accent:#2E6B4F;      /* hungarian green */
  --accent-ink:#FFFFFF;
  --accent-soft:#E4EFE9;
  --bad:#C0392B;
  --bad-soft:#F7E6E3;
  --good:#2E6B4F;
  --good-soft:#E4EFE9;
  --shadow:0 1px 3px rgba(32,36,31,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161915; --surface:#20241F; --surface2:#2A2F28;
    --ink:#E9E7DF; --ink-soft:#9BA194; --line:#3A4038;
    --accent:#7FBD9C; --accent-ink:#14261D; --accent-soft:#26382F;
    --bad:#E07A6B; --bad-soft:#3C2723; --good:#7FBD9C; --good-soft:#26382F;
    --shadow:0 1px 3px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#161915; --surface:#20241F; --surface2:#2A2F28;
  --ink:#E9E7DF; --ink-soft:#9BA194; --line:#3A4038;
  --accent:#7FBD9C; --accent-ink:#14261D; --accent-soft:#26382F;
  --bad:#E07A6B; --bad-soft:#3C2723; --good:#7FBD9C; --good-soft:#26382F;
  --shadow:0 1px 3px rgba(0,0,0,.4);
}

/* ---------- base ---------- */
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic","Segoe UI",sans-serif;
  line-height:1.55; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:520px;margin:0 auto;padding:20px 16px 64px}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none;padding:0}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.hu{font-family:Georgia,"Times New Roman","Noto Serif KR",serif}

/* ---------- header ---------- */
header{display:flex;align-items:center;gap:10px;margin-bottom:20px}
header .flag{width:22px;height:15px;border-radius:2px;flex:none;
  background:linear-gradient(to bottom,#CE2939 33%,#F6F3EE 33% 66%,#477050 66%)}
header h1{font-size:1.15rem;margin:0;letter-spacing:-.01em}
header h1 small{color:var(--ink-soft);font-weight:400;font-size:.8rem;margin-left:6px}
.backbtn{margin-left:auto;color:var(--ink-soft);font-size:.9rem;padding:6px 10px;border-radius:8px}
.backbtn:hover{background:var(--surface2)}

/* ---------- cards / common ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--shadow);padding:18px;margin-bottom:14px}
.card h2{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;
  color:var(--ink-soft);margin:0 0 10px;font-weight:600}
.big-btn{display:block;width:100%;text-align:center;background:var(--accent);color:var(--accent-ink);
  border-radius:12px;padding:14px;font-size:1.02rem;font-weight:700;margin-top:6px}
.big-btn:active{transform:translateY(1px)}
.big-btn.secondary{background:var(--surface2);color:var(--ink)}
.big-btn.danger-soft{background:var(--bad-soft);color:var(--bad)}
.big-btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px}
.row .big-btn{flex:1}
.muted{color:var(--ink-soft);font-size:.86rem}
.center{text-align:center}

/* progress */
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s ease}
.stats{display:flex;justify-content:space-between;font-size:.85rem;color:var(--ink-soft)}
.stats b{color:var(--ink);font-variant-numeric:tabular-nums}

/* badge */
.pill{display:inline-block;font-size:.75rem;font-weight:700;padding:2px 10px;border-radius:99px;
  background:var(--accent-soft);color:var(--accent)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}

/* ---------- flashcard ---------- */
.fc-stage{perspective:1000px;margin:6px 0 14px}
.fc{position:relative;width:100%;height:300px;transform-style:preserve-3d;
  transition:transform .45s cubic-bezier(.4,.1,.2,1);cursor:pointer}
.fc.flipped{transform:rotateY(180deg)}
@media (prefers-reduced-motion: reduce){
  .fc{transition:none}
  .bar i{transition:none}
}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:20px;text-align:center}
.fc-back{transform:rotateY(180deg)}
.fc .emoji{font-size:3.4rem;line-height:1}
.fc .word{font-size:1.9rem;font-weight:700;letter-spacing:-.01em}
.fc .meaning{font-size:1.5rem;font-weight:700}
.fc .hint{position:absolute;bottom:12px;left:0;right:0;font-size:.75rem;color:var(--ink-soft)}
.mark-row{display:flex;gap:10px;width:100%;max-width:300px;margin-top:10px}
.mk-btn{flex:1;border-radius:10px;padding:11px 6px;font-weight:700;font-size:.95rem}
.mk-btn.no{background:var(--bad-soft);color:var(--bad)}
.mk-btn.yes{background:var(--good-soft);color:var(--good)}
.fc-nav{display:flex;align-items:center;justify-content:space-between;gap:10px}
.fc-nav button{background:var(--surface2);border-radius:10px;padding:10px 18px;font-weight:600}
.fc-nav button[disabled]{opacity:.35;cursor:default}
.dots{display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
.dots i{width:7px;height:7px;border-radius:99px;background:var(--line)}
.dots i.on{background:var(--accent)}

/* ---------- quiz ---------- */
.q-word{text-align:center;margin:8px 0 4px}
.q-word .emoji{font-size:2.6rem}
.q-word .word{font-size:1.7rem;font-weight:700}
.opts{display:flex;flex-direction:column;gap:9px;margin-top:16px}
.opt{background:var(--surface);border:1.5px solid var(--line);border-radius:11px;
  padding:13px 15px;text-align:left;font-size:1rem;transition:border-color .12s}
.opt:hover{border-color:var(--accent)}
.opt.correct{background:var(--good-soft);border-color:var(--good);font-weight:700}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt[disabled]{cursor:default}
.q-top{display:flex;justify-content:space-between;align-items:center;font-size:.85rem;color:var(--ink-soft)}
.q-feedback{min-height:1.5em;text-align:center;font-weight:700;margin-top:12px}
.q-feedback.ok{color:var(--good)}
.q-feedback.no{color:var(--bad)}

/* ---------- vocab list ---------- */
.day-group{margin-bottom:18px}
.day-group h3{font-size:.95rem;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.wlist{display:flex;flex-direction:column;gap:6px}
.wrow{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);
  border-radius:10px;padding:9px 12px}
.wrow .emoji{font-size:1.3rem;flex:none}
.wrow .txt{flex:1;min-width:0}
.wrow .hu-w{font-weight:700}
.wrow .ko-w{font-size:.85rem;color:var(--ink-soft)}
.wrow .mk{flex:none;width:36px;height:36px;border-radius:9px;background:var(--surface2);
  color:var(--ink-soft);font-weight:800;font-size:1rem}
.wrow .mk.known{background:var(--good-soft);color:var(--good)}
.wrow .mk.unknown{background:var(--bad-soft);color:var(--bad)}
.wrow.is-wrong{border-color:var(--bad)}

/* filter chips */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{padding:6px 13px;border-radius:99px;background:var(--surface2);font-size:.85rem;font-weight:600;color:var(--ink-soft)}
.chip.on{background:var(--accent);color:var(--accent-ink)}
.locked{color:var(--ink-soft);font-size:.85rem;background:var(--surface2);
  border-radius:10px;padding:10px 12px}

/* review strip */
.review-list{display:flex;flex-direction:column;gap:6px;margin-bottom:6px}

/* history */
.hist{display:flex;flex-direction:column;gap:6px}
.hist .h-row{display:flex;justify-content:space-between;font-size:.9rem;
  border-bottom:1px dashed var(--line);padding:5px 2px}
.hist .h-row:last-child{border-bottom:none}
.hist b{font-variant-numeric:tabular-nums}

footer{margin-top:34px;text-align:center}
footer button{color:var(--ink-soft);font-size:.8rem;text-decoration:underline}

.result-emoji{font-size:3.2rem;text-align:center;margin:6px 0}
.score{font-size:2.2rem;font-weight:800;text-align:center;font-variant-numeric:tabular-nums}
.score small{font-size:1.1rem;color:var(--ink-soft);font-weight:600}
</style>
</head>

const PER_DAY=10, TEST_EVERY=5, BASE_DAYS=20, PACK_DAYS=10;
const KEY='tizszo_v1';

/* ================= state ================= */
const defState = ()=>({completedDays:0, wrongPool:[], testsTaken:[], testHistory:[], marks:{}, extraPacks:0});
let state;
try{ state = Object.assign(defState(), JSON.parse(localStorage.getItem(KEY)||'{}')); }
catch(e){ state = defState(); }
const save = ()=>localStorage.setItem(KEY, JSON.stringify(state));

const DAYS = ()=>BASE_DAYS + (state.extraPacks||0)*PACK_DAYS;   // 추가 팩을 받으면 30일로 확장
const currentDay = ()=>Math.min(state.completedDays+1, DAYS());
const testDue = ()=>state.completedDays>0 && state.completedDays%TEST_EVERY===0
  && !state.testsTaken.includes(state.completedDays/TEST_EVERY);
const allDone = ()=>state.completedDays>=DAYS() && !testDue();
const unknownIds = ()=>Object.keys(state.marks).filter(k=>state.marks[k]===-1).map(Number);
const knownCount = ()=>Object.keys(state.marks).filter(k=>state.marks[k]===1).length;
const wordsOfDay = d=>W.slice((d-1)*PER_DAY, d*PER_DAY);
const byId = id=>W[id];

/* ================= utils ================= */
const $ = s=>document.querySelector(s);
const app = document.getElementById('app');
const backbtn = document.getElementById('backbtn');
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

/* 알아요(1)/몰라요(-1) 표시 토글 */
window.cycleMark=function(id,btn){
  const cur=state.marks[id]||0, nxt=cur===0?1:cur===1?-1:0;
  if(nxt===0) delete state.marks[id]; else state.marks[id]=nxt;
  save();
  btn.className='mk'+(nxt===1?' known':nxt===-1?' unknown':'');
  btn.textContent=nxt===1?'✓':nxt===-1?'✗':'–';
  btn.title=nxt===1?'알아요':nxt===-1?'몰라요':'표시 없음';
};

function view(html, showBack){
  app.innerHTML=html;
  backbtn.hidden=!showBack;
  window.scrollTo(0,0);
}
backbtn.addEventListener('click',()=>renderHome());

/* ================= home ================= */
function renderHome(){
  const day=currentDay(), learned=state.completedDays*PER_DAY, total=DAYS()*PER_DAY;
  const pct=Math.round(state.completedDays/DAYS()*100);
  const block=state.completedDays/TEST_EVERY;
  const unk=unknownIds().length;

  let action='';
  if(allDone()){
    action=`<p class="center" style="font-size:2rem;margin:4px 0">🎉</p>
      <p class="center"><b>${total}단어 완주! Gratulálok!</b></p>`;
    if(state.wrongPool.length)
      action+=`<button class="big-btn danger-soft" id="go-wrongtest">오답 ${state.wrongPool.length}개 정리 테스트</button>`;
  }else if(testDue()){
    const carried=state.wrongPool.length+unknownIds().filter(id=>id<(state.completedDays-TEST_EVERY)*PER_DAY).length;
    action=`<p class="muted center">Day ${state.completedDays-4}–${state.completedDays} 단어를 테스트해야<br>다음 학습이 열립니다.</p>
      <button class="big-btn" id="go-test">📝 테스트 ${block} 시작
      ${carried?`(+ 이월 단어)`:''}</button>`;
  }else{
    action=`<button class="big-btn" id="go-learn">📖 Day ${day} 학습 시작 — 오늘의 10단어</button>`;
  }

  const nextTestIn = testDue()?0:(TEST_EVERY - state.completedDays%TEST_EVERY);

  view(`
  <section class="card">
    <h2>진행 현황</h2>
    <div class="stats"><span>Day <b>${Math.min(state.completedDays,DAYS())}</b> / ${DAYS()} 완료</span>
      <span>배운 단어 <b>${learned}</b> / ${total}</span></div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="stats"><span>${allDone()?'완주':`다음 테스트까지 ${testDue()?0:nextTestIn}일`}</span>
      <span>오답 노트 <b>${state.wrongPool.length}</b>개</span></div>
    <div class="stats" style="margin-top:4px"><span>✓ 알아요 <b>${knownCount()}</b>개</span>
      <span>✗ 몰라요 <b>${unk}</b>개</span></div>
  </section>
  <section class="card">${action}</section>
  ${state.completedDays>0?`
  <section class="card">
    <h2>복습 · 단어장</h2>
    <div class="row">
      <button class="big-btn secondary" id="go-vocab">📒 단어장</button>
      ${unk&&!allDone()?`<button class="big-btn danger-soft" id="go-unknown">✗ 몰라요 단어</button>`:''}
    </div>
  </section>`:''}
  ${!state.extraPacks?`
  <section class="card">
    <h2>추가 단어</h2>
    <p class="muted">기본 200단어에 이어 심화 100단어(직업 · 쇼핑 · 헝가리 음식 · 동사 · 방향 · 취미 · 건강 · 표현)를 더 받을 수 있어요. Day 21–30으로 이어지고 테스트도 똑같이 5일마다 진행됩니다.</p>
    <button class="big-btn secondary" id="get-pack">🎒 추가 단어 100개 받기</button>
  </section>`:''}
  ${state.testHistory.length?`
  <section class="card">
    <h2>테스트 기록</h2>
    <div class="hist">${state.testHistory.map(h=>
      `<div class="h-row"><span>${h.label}</span><b>${h.score} / ${h.total}</b></div>`).join('')}
    </div>
  </section>`:''}
  `,false);

  const on=(id,fn)=>{const el=document.getElementById(id); if(el)el.addEventListener('click',fn);};
  on('go-learn',()=>startLearn());
  on('go-test',()=>testIntro(block));
  on('go-wrongtest',()=>testIntro('wrong'));
  on('go-vocab',()=>renderVocab('all'));
  on('go-unknown',()=>renderVocab('unknown'));
  on('get-pack',()=>{
    state.extraPacks=1; save(); renderHome();
  });
}

/* ================= learn : 복습 → 카드 → 확인 퀴즈 ================= */
function startLearn(){
  const day=currentDay();
  if(day>1) renderReview(day);
  else renderCards(day);
}

function wordRow(w, flagWrong){
  const m=state.marks[w.id]||0;
  return `<div class="wrow${flagWrong?' is-wrong':''}">
    <span class="emoji">${w.em}</span>
    <span class="txt"><span class="hu hu-w">${esc(w.hu)}</span><br>
    <span class="ko-w">${esc(w.ko)}</span></span>
    <button class="mk${m===1?' known':m===-1?' unknown':''}" onclick="cycleMark(${w.id},this)"
      title="${m===1?'알아요':m===-1?'몰라요':'표시 없음'}">${m===1?'✓':m===-1?'✗':'–'}</button>
  </div>`;
}

function renderReview(day){
  const prev=wordsOfDay(day-1);
  const unk=unknownIds().filter(id=>byId(id).day<day-1).map(byId);
  view(`
  <section class="card">
    <h2>Day ${day} · 시작 전 복습</h2>
    <p class="muted">어제 배운 단어를 한 번 훑고 시작하세요. 뜻을 가리고 먼저 떠올려 보면 더 좋아요.</p>
    <div class="review-list">${prev.map(w=>wordRow(w)).join('')}</div>
    ${unk.length?`<p class="muted" style="margin-top:12px"><b>✗ 몰라요 표시 단어</b> — 다음 테스트에 나와요.</p>
    <div class="review-list">${unk.map(w=>wordRow(w)).join('')}</div>`:''}
    <button class="big-btn" id="to-cards">오늘의 새 단어 보러 가기 →</button>
  </section>`,true);
  document.getElementById('to-cards').addEventListener('click',()=>renderCards(day));
}

function renderCards(day){
  const words=wordsOfDay(day);
  let idx=0, flipped=false, maxSeen=0;

  function draw(){
    const w=words[idx];
    view(`
    <section>
      <div class="q-top"><span>Day ${day} · 새 단어</span><span>${idx+1} / ${words.length}</span></div>
      <div class="fc-stage">
        <div class="fc${flipped?' flipped':''}" id="fc" role="button" tabindex="0" aria-label="카드 뒤집기">
          <div class="fc-face">
            <div class="emoji">${w.em}</div>
            <div class="hu word">${esc(w.hu)}</div>
            <div class="hint">뜻을 먼저 떠올린 뒤, 탭해서 확인</div>
          </div>
          <div class="fc-face fc-back">
            <div class="emoji">${w.em}</div>
            <div class="meaning">${esc(w.ko)}</div>
            <div class="muted hu">${esc(w.hu)}</div>
            <div class="mark-row">
              <button class="mk-btn no" id="mk-no">✗ 아직 몰라요</button>
              <button class="mk-btn yes" id="mk-yes">✓ 알아요</button>
            </div>
            <div class="hint">표시하면 다음 카드로 넘어가요</div>
          </div>
        </div>
      </div>
      <div class="fc-nav">
        <button id="prev" ${idx===0?'disabled':''}>← 이전</button>
        <div class="dots">${words.map((_,i)=>`<i class="${i<=maxSeen?'on':''}"></i>`).join('')}</div>
        <button id="next">${idx<words.length-1?'다음 →':'다 봤어요'}</button>
      </div>
      ${maxSeen>=words.length-1?`<button class="big-btn" style="margin-top:18px" id="to-quiz">✏️ 확인 퀴즈 (10문제)</button>`:''}
    </section>`,true);

    const fc=document.getElementById('fc');
    const flip=()=>{flipped=!flipped;fc.classList.toggle('flipped',flipped);};
    fc.addEventListener('click',e=>{ if(!e.target.classList.contains('mk-btn')) flip(); });
    fc.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();flip();} });
    const advance=()=>{
      if(idx<words.length-1){idx++;maxSeen=Math.max(maxSeen,idx);flipped=false;draw();}
      else{maxSeen=words.length-1;draw();}
    };
    const mark=(m)=>{ state.marks[w.id]=m; save(); advance(); };
    document.getElementById('mk-no').addEventListener('click',e=>{e.stopPropagation();mark(-1);});
    document.getElementById('mk-yes').addEventListener('click',e=>{e.stopPropagation();mark(1);});
    document.getElementById('prev').addEventListener('click',()=>{if(idx>0){idx--;flipped=false;draw();}});
    document.getElementById('next').addEventListener('click',advance);
    const tq=document.getElementById('to-quiz');
    if(tq)tq.addEventListener('click',()=>dayQuiz(day));
  }
  draw();
}

/* 오늘 배운 10단어 확인 퀴즈 — 틀리면 맞힐 때까지 반복 */
function dayQuiz(day){
  const words=wordsOfDay(day);
  let queue=shuffle(words.map(w=>w.id));
  let firstTryWrong=new Set(), asked=0;

  function next(){
    if(!queue.length){ finishDay(day, firstTryWrong.size); return; }
    const w=byId(queue[0]);
    asked++;
    const opts=makeOptions(w,'ko');
    view(`
    <section>
      <div class="q-top"><span>Day ${day} · 확인 퀴즈</span><span>남은 문제 ${queue.length}</span></div>
      <div class="q-word">
        <div class="emoji">${w.em}</div>
        <div class="hu word">${esc(w.hu)}</div>
      </div>
      <div class="opts">${opts.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o.text)}</button>`).join('')}</div>
      <div class="q-feedback" id="fb"></div>
    </section>`,true);

    document.querySelectorAll('.opt').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const i=+btn.dataset.i, ok=opts[i].correct;
        document.querySelectorAll('.opt').forEach((b,j)=>{
          b.disabled=true;
          if(opts[j].correct)b.classList.add('correct');
        });
        const fb=document.getElementById('fb');
        if(ok){
          fb.textContent='맞았어요!'; fb.className='q-feedback ok';
          queue.shift();
        }else{
          btn.classList.add('wrong');
          fb.textContent='다시 나올 거예요. 정답을 확인하세요.'; fb.className='q-feedback no';
          firstTryWrong.add(w.id);
          queue.push(queue.shift());   // 뒤로 보내 재출제
        }
        setTimeout(next, ok?700:1600);
      });
    });
  }
  next();
}

function finishDay(day, wrongCnt){
  state.completedDays=Math.max(state.completedDays, day);
  save();
  const due=testDue();
  view(`
  <section class="card center">
    <div class="result-emoji">🌟</div>
    <p><b>Day ${day} 완료!</b></p>
    <p class="muted">확인 퀴즈에서 한 번에 못 맞힌 단어: ${wrongCnt}개<br>내일 시작할 때 오늘 단어를 다시 복습하게 됩니다.</p>
    ${due?`<button class="big-btn" id="nx">📝 테스트가 열렸어요 — 지금 보기</button>`
        :`<button class="big-btn" id="nx">홈으로</button>`}
  </section>`,false);
  document.getElementById('nx').addEventListener('click',()=>due?testIntro(state.completedDays/TEST_EVERY):renderHome());
}

/* ================= test ================= */
/* block: 1.. → 해당 5일치 50단어 + 이전 오답 + 몰라요 표시 / 'wrong' → 오답만 */
function testWords(block){
  if(block==='wrong') return state.wrongPool.slice();
  const start=(block-1)*TEST_EVERY*PER_DAY, end=block*TEST_EVERY*PER_DAY;
  const ids=new Set(W.slice(start,end).map(w=>w.id));
  state.wrongPool.forEach(id=>ids.add(id));
  unknownIds().forEach(id=>{ if(id<state.completedDays*PER_DAY) ids.add(id); });
  return [...ids];
}

function testIntro(block){
  const ids=testWords(block);
  const isWrong=block==='wrong';
  const label=isWrong?'오답 정리 테스트':`테스트 ${block} (Day ${(block-1)*5+1}–${block*5})`;
  const carried=isWrong?0:ids.length-TEST_EVERY*PER_DAY;
  view(`
  <section class="card">
    <h2>${label}</h2>
    <p class="muted">총 <b>${ids.length}문제</b> — ${isWrong?'지금까지 틀린 단어만 다시 봅니다.':`최근 5일 단어 50개${carried>0?` + 이전 오답·몰라요 표시 ${carried}개`:''}.`}<br>
    헝가리어→뜻, 뜻→헝가리어가 섞여 나옵니다.<br>
    틀린 단어는 다음 테스트에 다시 나오고, 몰라요 표시는 맞히면 자동으로 지워집니다.</p>
    <button class="big-btn" id="go">시작</button>
  </section>`,true);
  document.getElementById('go').addEventListener('click',()=>runTest(block,ids));
}

function runTest(block, ids){
  const order=shuffle(ids);
  let i=0; const right=[], wrong=[];

  function next(){
    if(i>=order.length){ finishTest(block, right, wrong); return; }
    const w=byId(order[i]);
    const dir=Math.random()<0.5?'ko':'hu';   // ko: hu→뜻 / hu: 뜻→hu
    const opts=makeOptions(w,dir);
    const isCarried=block!=='wrong'&&(state.wrongPool.includes(w.id)||state.marks[w.id]===-1);
    view(`
    <section>
      <div class="q-top"><span>${block==='wrong'?'오답 테스트':'테스트 '+block}
        ${isCarried?'<span class="pill bad">이월</span>':''}</span>
        <span>${i+1} / ${order.length}</span></div>
      <div class="q-word">
        ${dir==='ko'?`
          <div class="emoji">${w.em}</div>
          <div class="hu word">${esc(w.hu)}</div>
          <p class="muted">뜻을 고르세요</p>`
        :`
          <div class="emoji">${w.em}</div>
          <div class="word">${esc(w.ko)}</div>
          <p class="muted">헝가리어를 고르세요</p>`}
      </div>
      <div class="opts">${opts.map((o,j)=>`<button class="opt${dir==='hu'?' hu':''}" data-i="${j}">${esc(o.text)}</button>`).join('')}</div>
      <div class="q-feedback" id="fb"></div>
    </section>`,true);

    document.querySelectorAll('.opt').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const j=+btn.dataset.i, ok=opts[j].correct;
        document.querySelectorAll('.opt').forEach((b,k)=>{
          b.disabled=true; if(opts[k].correct)b.classList.add('correct');
        });
        const fb=document.getElementById('fb');
        if(ok){ right.push(w.id); fb.textContent='정답!'; fb.className='q-feedback ok'; }
        else{ wrong.push(w.id); btn.classList.add('wrong');
          fb.textContent=`오답 — ${w.hu} = ${w.ko}`; fb.className='q-feedback no'; }
        i++;
        setTimeout(next, ok?650:1800);
      });
    });
  }
  next();
}

function finishTest(block, right, wrong){
  // 오답 이월 규칙: 맞힌 단어는 오답 노트에서 제거, 틀린 단어는 추가
  state.wrongPool=state.wrongPool.filter(id=>!right.includes(id));
  wrong.forEach(id=>{ if(!state.wrongPool.includes(id)) state.wrongPool.push(id); });
  // 테스트에서 맞힌 단어는 '몰라요' 표시 자동 해제
  right.forEach(id=>{ if(state.marks[id]===-1) delete state.marks[id]; });
  const total=right.length+wrong.length;
  const label=block==='wrong'?'오답 정리':`테스트 ${block}`;
  if(block!=='wrong'&&!state.testsTaken.includes(block)) state.testsTaken.push(block);
  state.testHistory.push({label, score:right.length, total});
  save();
  const pct=Math.round(right.length/total*100);
  view(`
  <section class="card center">
    <div class="result-emoji">${pct===100?'🏆':pct>=80?'👏':'💪'}</div>
    <p class="score">${right.length}<small> / ${total}</small></p>
    <p class="muted">${wrong.length?`틀린 ${wrong.length}개는 오답 노트에 담겨<br>다음 테스트에 다시 나옵니다.`:'전부 정답! 오답 이월 없음.'}</p>
    ${wrong.length?`<div class="review-list" style="margin-top:12px;text-align:left">${wrong.map(id=>wordRow(byId(id),true)).join('')}</div>`:''}
    <button class="big-btn" id="home">홈으로</button>
  </section>`,false);
  document.getElementById('home').addEventListener('click',renderHome);
}

/* 보기 4개 생성: dir==='ko' → 뜻 고르기 / 'hu' → 헝가리어 고르기 */
function makeOptions(w, dir){
  const field=dir==='ko'?'ko':'hu';
  const limit=DAYS()*PER_DAY;   // 잠긴 팩의 단어는 보기에 쓰지 않음
  const wrongPool=shuffle(W.filter(x=>x.id!==w.id && x.id<limit && x[field]!==w[field])).slice(0,3);
  return shuffle([
    {text:w[field], correct:true},
    ...wrongPool.map(x=>({text:x[field], correct:false})),
  ]);
}

/* ================= vocab list ================= */
/* filter: 'all' | 'known' | 'unknown' | 'wrong' */
function renderVocab(filter){
  const maxDay=Math.min(currentDay(), DAYS());
  const learnedWords=W.filter(w=>w.day<=maxDay && w.id<DAYS()*PER_DAY);
  const chips=[['all','전체'],['known','✓ 알아요'],['unknown','✗ 몰라요'],['wrong','오답']];
  let html=`<div class="chips">${chips.map(([k,l])=>
    `<button class="chip${filter===k?' on':''}" data-f="${k}">${l}</button>`).join('')}</div>`;

  if(filter==='all'){
    for(let d=1;d<=DAYS();d++){
      if(d>maxDay){
        html+=`<div class="day-group"><h3>Day ${d}</h3><div class="locked">🔒 아직 잠겨 있어요</div></div>`;
        continue;
      }
      html+=`<div class="day-group"><h3>Day ${d}
        ${d<=state.completedDays?'<span class="pill">완료</span>':'<span class="pill" style="background:var(--surface2);color:var(--ink-soft)">오늘</span>'}</h3>
        <div class="wlist">${wordsOfDay(d).map(w=>wordRow(w,state.wrongPool.includes(w.id))).join('')}</div></div>`;
    }
  }else{
    const list = filter==='wrong'
      ? state.wrongPool.map(byId)
      : learnedWords.filter(w=>state.marks[w.id]===(filter==='known'?1:-1));
    const title = filter==='wrong'?'오답 노트':filter==='known'?'알아요 표시':'몰라요 표시';
    html+=`<section class="card"><h2>${title} (${list.length})</h2>
      <div class="wlist">${list.map(w=>wordRow(w,filter==='wrong')).join('')||'<p class="muted">비어 있어요!</p>'}</div></section>`;
  }
  view(html,true);
  document.querySelectorAll('.chip').forEach(c=>
    c.addEventListener('click',()=>renderVocab(c.dataset.f)));
}

/* ================= reset ================= */
document.getElementById('resetbtn').addEventListener('click',()=>{
  if(confirm('모든 진도와 오답 기록을 지울까요?')){
    state=defState(); save(); renderHome();
  }
});

renderHome();
</script>
